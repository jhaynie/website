<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="450" viewBox="0 0 1600 450" role="img" aria-label="Bulletin hero">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1420"/>
      <stop offset="45%" stop-color="#1c2438"/>
      <stop offset="100%" stop-color="#0f2a28"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="450" fill="url(#g)"/>
  <rect width="1600" height="450" fill="url(#grid)"/>
  <circle cx="1280" cy="100" r="150" fill="rgba(180,80,100,0.14)"/>
  <circle cx="380" cy="360" r="160" fill="rgba(80,160,200,0.12)"/>
  <rect x="128" y="158" width="18" height="42" fill="#7dffb0" opacity="0.95">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.05s" repeatCount="indefinite" calcMode="discrete"/>
  </rect>
  <text x="160" y="188" fill="#f0ebe6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="36" letter-spacing="6">BULLETIN</text>
  <text x="160" y="232" fill="#a89f96" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" letter-spacing="1">american-born-ai</text>
</svg>
